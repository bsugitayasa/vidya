server {
    listen 80;
    
    root /usr/share/nginx/html;
    index index.html;

    # Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
        
        # Disable cache for index.html so users always get the latest version immediately
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache Vite-hashed compiled assets (JS, CSS) for 1 year
    # The ^~ modifier ensures that Nginx stops searching regex matches once /assets/ is matched
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache other non-hashed static assets (images, icons, etc.) for 30 days with must-revalidate
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
        access_log off;
    }
}
